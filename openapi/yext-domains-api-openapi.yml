                        readOnly: true
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: updateDomainAssociation
      tags:
      - Domains
      summary: 'Domain Association: Update

        '
      parameters:
      - $ref: '#/components/parameters/domainId'
      - $ref: '#/components/parameters/domainAssociationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
