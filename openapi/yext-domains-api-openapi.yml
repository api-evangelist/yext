components:
  schemas:
    site:
      description: The Pages site to associate with the parent [Domain](#tag/Domains/operation/createDomain) resource.
      type: object
      properties:
        name:
          description: Pages site resource name.
          type: string
          example: accounts/123456/sites/6789
        primary:
          description: 'If true, this will be the primary Domain for the Pages site, otherwise it will be an alias Domain.

            A Pages site can have at most one primary Domain.

            '
          type: boolean
          default: false
    ResponseMetaWithError:
      allOf:
      - $ref: '#/components/schemas/ResponseMeta'
      - type: object
        properties:
          errors:
            type: array
            description: List of errors and warnings.
            items:
              $ref: '#/components/schemas/ResponseError'
    previousPageToken:
      type: string
      description: The token to use to retrieve the previous page of results. If empty, this is the first page.
      example: eyJ0b2tlbiI6InB4Zl9wcmV2X3BhZ2VfdG9rZW4ifQ==
    nextPageToken:
      type: string
      description: The token to use to retrieve the next page of results. If empty, this is the last page.
      example: eyJ0b2tlbiI6InB4Zl9wYWdlX3Rva2VuIn0=
    managed_csr:
      description: 'SSL certificate will be issued using the given [Managed CSR](#tag/Domains/operation/createManagedCsr).

        Exactly one of `managed_ssl`, `managed_csr`, or `custom_ssl_certificate` must be set for a domain.

        '
      type: object
      properties:
        managed_csr_id:
          description: 'The name of the [Managed CSR](#tag/Domains/operation/createManagedCsr) resource.

            '
          type: string
          example: accounts/123456/csrs/4f72b877-e2d0-4de4-9324-b9cf2c03e1a0
        custom_public_certificate:
          description: 'Public CA signed certificate.

            '
          type: string
          format: pem
          writeOnly: true
          example: '-----BEGIN CERTIFICATE-----

            MIIC2DCCAcCAQAwgY4xCzAJBgNVBAYTAlVTMRMwEQYDVQQIEwpDYWxpZm9ybmlh

            ...

            -----END CERTIFICATE-----

            '
        hostname_validation:
          description: 'Proof of ownership for the SSL provider.

            '
          type: object
          readOnly: true
          properties:
            cname_target:
              type: string
              example: idzm5s34j5.yext.pgscdncf.com.
            txt_domain:
              type: string
              example: _yext-domain.www.example.com
            txt_value:
              type: string
              format: uuid
            http_uri:
              type: string
              example: http://www.example.com/.well-known/yext-domain-challenge/35f00e6a-61c2-4857-b2cc-4c736f86b5ac
            http_body:
              type: string
              format: uuid
    totalSize:
      type: integer
      description: The total number of items that match the filter criteria, ignoring pagination.
      example: 100
    custom_ssl_certificate:
      description: 'The provided custom SSL certificate will be used for serving requests to the domain.

        Exactly one of `managed_ssl`, `managed_csr`, or `custom_ssl_certificate` must be set for a domain.

        '
      type: object
      required:
      - public_certificate
      - private_key
      properties:
        public_certificate:
          type: string
          format: pem
          writeOnly: true
          example: '-----BEGIN CERTIFICATE-----

            MIIC2DCCAcCAQAwgY4xCzAJBgNVBAYTAlVTMRMwEQYDVQQIEwpDYWxpZm9ybmlh

            ...

            -----END CERTIFICATE-----

            '
        private_key:
          type: string
          format: pem
          writeOnly: true
          example: '-----BEGIN PRIVATE KEY-----

            MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDBj08sp5++4anG

            ...

            -----END PRIVATE KEY-----

            '
        hostname_validation:
          description: 'Proof of ownership for the SSL provider.

            '
          type: object
          readOnly: true
          properties:
            cname_target:
              type: string
              example: idzm5s34j5.yext.pgscdncf.com.
            txt_domain:
              type: string
              example: _yext-domain.www.example.com
            txt_value:
              type: string
              format: uuid
            http_uri:
              type: string
              example: http://www.example.com/.well-known/yext-domain-challenge/35f00e6a-61c2-4857-b2cc-4c736f86b5ac
            http_body:
              type: string
              format: uuid
    ResponseMeta:
      type: object
      properties:
        uuid:
          type: string
          example: 4f72b877-e2d0-4de4-9324-b9cf2c03e1a0
          description: Unique ID for this request / response.
    certificate_authority:
      type: string
      enum:
      - GOOGLE_TRUST
      - LETS_ENCRYPT
      default: GOOGLE_TRUST
    ResponseError:
      type: object
      properties:
        name:
          type: string
        code:
          type: integer
          description: 'Code that uniquely identifies the error or warning.

            '
        type:
          type: string
          enum:
          - FATAL_ERROR
          - NON_FATAL_ERROR
          - WARNING
        message:
          type: string
          description: Message explaining the problem.
  parameters:
    index_pageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 10
        minimum: 0
        maximum: 50
      description: Number of results to return per page. Sizes above the maximum will be clamped at the maximum value.
    viewDefaultBasic:
      name: view
      in: query
      schema:
        type: string
        enum:
        - FULL
        - BASIC
        default: BASIC
      description: '`FULL` returns all details, while `BASIC` omits certain SSL information.

        Using `BASIC` will also usually result in a lower response latency relative to using `FULL`.

        '
    domainIdAllowAll:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Set to "-" to reference Domain Associations from all domains in this account.
    hostnameSearchFilter:
      name: hostname_search
      in: query
      schema:
        type: string
      description: Case-insensitive substring used to filter by hostname.
      example: example
    hostnameFilters:
      name: hostname
      in: query
      schema:
        type: array
        items:
          type: string
      description: Exact hostname(s) to filter results by. If not provided, results for all hostnames will be returned.
      example: www.example.com,test.example.com
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    v:
      name: v
      in: query
      required: true
      schema:
        type: string
      description: A date in `YYYYMMDD` format.
    showDeleted:
      name: show_deleted
      in: query
      schema:
        type: boolean
        default: false
    viewDefaultFull:
      name: view
      in: query
      schema:
        type: string
        enum:
        - FULL
        - BASIC
        default: FULL
      description: '`FULL` returns all details, while `BASIC` omits certain SSL information.

        Using `BASIC` will also usually result in a lower response latency relative to using `FULL`.

        '
    managedCsrId:
      name: managedCsrId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    index_pageToken:
      name: page_token
      in: query
      schema:
        type: string
      description: Token to retrieve the next page of results. If not provided, the first page of results will be returned.
    domainId:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    domainAssociationId:
      name: domainAssociationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    forceMove:
      name: force_move
      in: query
      schema:
        type: boolean
        default: false
      description: If true, and the domain is in a MOVE_REQUIRED state, will move ownership of the domain to this account.
  responses:
    ErrorResponse:
      description: Error Response
      content:
        application/json:
          schema:
            title: ErrorResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMetaWithError'
              response:
                type: object
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api-key:
      type: apiKey
      name: api-key
      in: header
