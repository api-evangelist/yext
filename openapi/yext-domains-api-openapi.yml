  /accounts/{accountId}/csrs:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - $ref: '#/components/parameters/v'
    post:
      operationId: createManagedCsr
      tags:
      - Domains
      summary: 'Managed CSR: Create

        '
      description: 'Creates a Certificate Signing Request (CSR) resource that can be used to provision SSL certificates.

        Once created, this resource can be referenced by [Domains](#tag/Domains/operation/createDomain) with the `managed_csr` SSL integration to provision

        certificates using this CSR and a public certificate.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Identifier for the resource.
                  type: string
                  readOnly: true
                  example: accounts/123456/csrs/4f72b877-e2d0-4de4-9324-b9cf2c03e1a0
                csr_payload:
                  type: object
                  properties:
                    common_name:
                      description: Fully qualified domain name.
                      type: string
                      example: www.example.com
                    sans:
                      description: Subject Alternative Names.
                      type: array
                      items:
                        type: string
                      example:
                      - test.example.com
                      - other.example.net
                    organization:
                      type: string
                      example: Example Inc.
                    organizational_unit:
                      type: string
                      example: IT Department
                    key_type:
                      type: string
                      enum:
                      - rsa2048
                      - p256v1
                    locality:
                      type: string
                      example: San Francisco
                    state:
                      type: string
                      example: California
                    country:
                      type: string
                      example: US
                csr:
                  description: The generated Certificate Signing Request.
                  type: string
                  readOnly: true
                  example: '-----BEGIN CERTIFICATE REQUEST-----

                    MIIC2DCCAcCAQAwgY4xCzAJBgNVBAYTAlVTMRMwEQYDVQQIEwpDYWxpZm9ybmlh

                    ...

                    -----END CERTIFICATE REQUEST-----

                    '
                created_time:
                  type: string
                  format: date-time
                  readOnly: true
              required:
              - csr_payload
              - csr
      responses:
        '201':
          description: Managed CSR created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
