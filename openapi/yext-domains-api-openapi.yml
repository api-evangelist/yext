                      csr_payload:
                        type: object
                        properties:
                          common_name:
                            description: Fully qualified domain name.
                            type: string
                            example: www.example.com
                          sans:
                            description: Subject Alternative Names.
                            type: array
                            items:
                              type: string
                            example:
                            - test.example.com
                            - other.example.net
                          organization:
                            type: string
                            example: Example Inc.
                          organizational_unit:
                            type: string
                            example: IT Department
                          key_type:
                            type: string
                            enum:
                            - rsa2048
                            - p256v1
                          locality:
                            type: string
                            example: San Francisco
                          state:
                            type: string
                            example: California
                          country:
                            type: string
                            example: US
                      csr:
                        description: The generated Certificate Signing Request.
                        type: string
                        readOnly: true
                        example: '-----BEGIN CERTIFICATE REQUEST-----

                          MIIC2DCCAcCAQAwgY4xCzAJBgNVBAYTAlVTMRMwEQYDVQQIEwpDYWxpZm9ybmlh

                          ...

                          -----END CERTIFICATE REQUEST-----

                          '
                      created_time:
                        type: string
                        format: date-time
                        readOnly: true
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
