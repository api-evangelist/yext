                              - CUSTOM
                              - LEGACY_YEXT_MANAGED
                              example: USER_OWNED
                            state:
                              type: string
                              readOnly: true
                              enum:
                              - PENDING_VERIFICATION
                              - VERIFICATION_FAILED
                              - PENDING_CREATION
                              - CREATING
                              - CREATION_FAILED
                              - ACTIVE
                              - PENDING_DELETION
                              - DELETED
                              - BLOCKED
                              - DELETION_FAILED
                              - MOVE_REQUIRED
                              example: ACTIVE
                            ownership_verification:
                              description: 'One of CNAME, TXT, or HTTP verification must be used to complete Yext ownership verification for the domain.

                                The tokens to use for each of these methods are provided in this object.

                                '
                              type: object
                              readOnly: true
                              properties:
                                cname_target:
                                  type: string
                                  example: idzm5s34j5.yext.pgscdncf.com.
                                txt_domain:
                                  type: string
                                  example: _yext-domain.www.example.com
                                txt_value:
                                  type: string
                                  format: uuid
                                http_uri:
                                  type: string
                                  example: http://www.example.com/.well-known/yext-domain-challenge/35f00e6a-61c2-4857-b2cc-4c736f86b5ac
                                http_body:
                                  type: string
                                  format: uuid
                            managed_ssl:
                              description: 'SSL certificate will be automatically managed by Yext.

                                Exactly one of `managed_ssl`, `managed_csr`, or `custom_ssl_certificate` must be set for a domain.

                                '
                              type: object
                              required:
                              - certificate_authority
                              - validation_method
                              properties:
                                certificate_authority:
                                  type: string
                                  enum:
                                  - GOOGLE_TRUST
                                  - LETS_ENCRYPT
                                  default: GOOGLE_TRUST
                                validation_method:
                                  type: string
                                  enum:
                                  - HTTP
                                  - TXT
                                  example: HTTP
                                hostname_validation:
                                  description: 'Proof of ownership for the SSL provider.

                                    '
                                  type: object
                                  readOnly: true
                                  properties:
                                    cname_target:
                                      type: string
                                      example: idzm5s34j5.yext.pgscdncf.com.
                                    txt_domain:
                                      type: string
                                      example: _yext-domain.www.example.com
                                    txt_value:
                                      type: string
                                      format: uuid
                                    http_uri:
                                      type: string
                                      example: http://www.example.com/.well-known/yext-domain-challenge/35f00e6a-61c2-4857-b2cc-4c736f86b5ac
                                    http_body:
                                      type: string
                                      format: uuid
                                http_validation:
                                  description: 'This will only be set if `HTTP` is selected via the `validation_method` field.

                                    '
                                  type: object
                                  readOnly: true
                                  properties:
                                    uri:
