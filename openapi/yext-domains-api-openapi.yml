                                MIIC2DCCAcCAQAwgY4xCzAJBgNVBAYTAlVTMRMwEQYDVQQIEwpDYWxpZm9ybmlh

                                ...

                                -----END CERTIFICATE REQUEST-----

                                '
                            created_time:
                              type: string
