      responses:
        '201':
          description: Domain Association updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  response:
                    title: Domain Association
                    type: object
                    properties:
                      name:
                        description: Identifier for the resource.
                        type: string
                        readOnly: true
                        example: accounts/123456/domains/4f72b877-e2d0-4de4-9324-b9cf2c03e1a0/associations/4f72b877-e2d0-4de4-9324-b9cf2c03e1a0
                      hostname:
                        description: 'For parent Domain''s with `wildcard=false`, this will equal parent Domain''s hostname.

                          For parent Domain''s with `wildcard=true`, this can be a single-level subdomain of the parent Domain''s hostname.

                          '
                        type: string
                        example: www.example.com
                      site:
