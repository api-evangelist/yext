                          '
                        type: string
                        enum:
                        - PAGES
                        example: PAGES
                      integration_type:
                        description: 'How the domain will be integrated with Yext. Only `USER_OWNED` is supported for domains created via the API.

                          '
                        type: string
                        enum:
                        - USER_OWNED
                        - CUSTOM
                        - LEGACY_YEXT_MANAGED
                        example: USER_OWNED
                      state:
