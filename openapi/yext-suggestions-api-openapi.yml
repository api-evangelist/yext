    | Klantenkaart                  | NL **only**       |

    | Klarna                        | SE **only**        |

    | LINE Pay                      | JP **only**       |

    | Maestro                       | AT,BE,CH, DE, GB, HR, IT, NL, PL, SI        |

    | MasterCard                    | **All**       |

    | MI Pay                        | CN **only**        |

