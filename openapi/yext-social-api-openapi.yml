      description: Error Response
      content:
        application/json:
          schema:
            title: ErrorResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMetaWithError'
              response:
                type: object
    EntityPostCommentsResponse:
      description: Entity Post Comments Response
      content:
        application/json:
          schema:
            title: EntityPostCommentsResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMeta'
              response:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommentWithReplies'
                  nextPageToken:
                    type: string
    EmptyResponse:
      description: Empty Response.
      content:
        application/json:
          schema:
            title: EmptyResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMeta'
              response:
                type: object
    PostResponse:
      description: Post Response
      content:
        application/json:
          schema:
            title: PostResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMeta'
              response:
                $ref: '#/components/schemas/Post'
    SocialEligibilityResponse:
      description: Social Eligibility Response
      content:
        application/json:
          schema:
            title: SocialEligibilityResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMeta'
              response:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      type: object
                      properties:
                        entityId:
                          type: string
                          description: The ID of the entity
                        publisher:
                          type: string
                          description: The name of the publisher
                        status:
                          type: string
                          description: The eligiblity status of the entityId/publisher pair
                          enum:
                          - ELIGIBLE
                          - INELIGIBLE
                        statusDetails:
                          type: array
                          items:
                            type: object
                            properties:
                              message:
                                type: string
                                description: A message indicating why the entityId is `INELIGIBLE` for a publisher
  parameters:
    pageToken:
      name: pageToken
      in: query
      schema:
        type: string
      required: false
      description: 'If a response to a previous request contained the **`nextPageToken`** field, pass that field''s value as the **`pageToken`** parameter to retrieve the next page of data.

        '
    entityPostId:
      name: entityPostId
      in: path
      required: true
      schema:
        type: string
      description: 'The ID of an individual post created for a given entity on a given publisher.

        '
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    v:
      name: v
      in: query
      required: true
      schema:
        type: string
      description: A date in `YYYYMMDD` format.
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api-key:
      type: apiKey
      name: api-key
      in: header
