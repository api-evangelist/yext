                  fileByteSize:
                    type: number
                    description: The size of the file in bytes.
                  mimeType:
                    type: string
                    description: The mime type of the video.
    CreateCommentResponse:
      description: Create Comment Response
      content:
        application/json:
          schema:
            title: CreateCommentResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMeta'
              response:
                type: object
                properties:
                  commentId:
                    type: string
                    description: The ID of a specific comment.
                  text:
                    type: string
                    description: The text of the comment.
                  parentCommentId:
                    type: string
                    description: 'If the comment is in response to another comment, this is the ID of the parent

                      comment.

                      '
    PostsResponse:
      description: Posts Response
      content:
        application/json:
          schema:
            title: PostsResponse
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/ResponseMeta'
              response:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextPageToken:
                    type: string
